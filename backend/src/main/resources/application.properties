spring.application.name=iw3-backend

# Credenciales opcionales en backend/.env (no se sube al repo)
spring.config.import=optional:file:.env[.properties]

# ---------- Base de datos (MySQL por defecto) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iw3?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# los DTO se arman dentro del service, no hace falta la sesion abierta en el controller
spring.jpa.open-in-view=false

# ---------- Reglas de negocio configurables ----------
# Cada cuantos segundos se guarda un detalle de carga (0 = todos)
app.carga.frecuencia-almacenamiento-segundos=${FRECUENCIA_DETALLE_SEGUNDOS:0}

# ---------- Alarmas de temperatura ----------
# Valores iniciales: despues se editan desde el sistema
app.alarma.temperatura-umbral=${ALARMA_TEMPERATURA_UMBRAL:40}
# separados por coma
app.alarma.destinatarios=${ALARMA_DESTINATARIOS:operaciones@planta.local}
app.alarma.remitente=${ALARMA_REMITENTE:alarmas@planta.local}

# ---------- Servidor de mail ----------
# Por defecto Mailpit (SMTP 1025, bandeja web en http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# timeouts para que un SMTP caido no cuelgue el envio
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# ---------- Seguridad (JWT) ----------
# Valores por defecto SOLO para desarrollo; en un servidor se definen por variable de entorno (secreto de 32+ caracteres)
app.seguridad.jwt-secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-123456}
app.seguridad.jwt-expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}
# contrasena de los usuarios de demo
app.seguridad.password-demo=${PASSWORD_DEMO:demo1234}

# ---------- OpenAPI / Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# los errores de cada endpoint se documentan a mano con @ApiResponse
springdoc.override-with-generic-response=false
