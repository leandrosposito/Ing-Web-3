spring.application.name=iw3-backend

# Permite definir las credenciales en un archivo backend/.env (ignorado por git).
# Ver .env.example. Si no existe, se usan variables de entorno del sistema.
spring.config.import=optional:file:.env[.properties]

# ---------- Base de datos (MySQL por defecto) ----------
# createDatabaseIfNotExist crea el schema "iw3" la primera vez.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iw3?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Las entidades se convierten a DTO dentro del service (con la transaccion abierta),
# asi que no necesitamos mantener la sesion abierta hasta la vista.
spring.jpa.open-in-view=false

# ---------- Reglas de negocio configurables ----------
# Cada cuantos segundos se guarda un registro de detalle de carga.
# 0 = se guardan todos los datos validos que llegan.
app.carga.frecuencia-almacenamiento-segundos=${FRECUENCIA_DETALLE_SEGUNDOS:0}

# ---------- Seguridad (JWT) ----------
# Los valores por defecto son SOLO para desarrollo. En un despliegue real se definen por variable de entorno.
# El secreto tiene que tener al menos 32 caracteres (HS256).
app.seguridad.jwt-secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-123456}
app.seguridad.jwt-expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}
# Contrasena de los usuarios de demo (sap, tms, carga, operador, admin) que se crean al arrancar.
app.seguridad.password-demo=${PASSWORD_DEMO:demo1234}

# ---------- OpenAPI / Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Documentamos a mano los errores de cada endpoint (si no, springdoc agrega todos los del
# GlobalExceptionHandler a todos los endpoints, aunque no puedan ocurrir).
springdoc.override-with-generic-response=false
