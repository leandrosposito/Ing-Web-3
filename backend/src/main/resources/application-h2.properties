# Perfil "h2": base en memoria para probar sin instalar MySQL.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Los datos se pierden al apagar la aplicacion.
spring.datasource.url=jdbc:h2:mem:iw3;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:iw3)
spring.h2.console.enabled=true
