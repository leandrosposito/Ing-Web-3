# Configuracion para los tests: base H2 en memoria, no hace falta MySQL.
spring.datasource.url=jdbc:h2:mem:iw3test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.carga.frecuencia-almacenamiento-segundos=0
