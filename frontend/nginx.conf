server {
    listen 80;

    # Las paginas del frontend. Si la ruta no es un archivo (ej: /monitoreo) se devuelve index.html
    # y el router de Vue decide que pantalla mostrar.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Lo que empieza con /api va al backend. "backend" es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
    }
}
